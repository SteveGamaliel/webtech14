<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance Bridge - Interactive Quiz</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      background: #f4f7fb;
      color: #243b53;
      font-family: Arial, sans-serif;
    }

    .quiz {
      max-width: 650px;
      margin: 30px auto;
      padding: 24px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 16px #102a4318;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      color: #52677d;
    }

    .progress-track {
      height: 10px;
      margin: 12px 0 24px;
      overflow: hidden;
      background: #e5edf5;
      border-radius: 10px;
    }

    #progressBar {
      width: 0;
      height: 100%;
      background: #087e8b;
      transition: width .25s ease;
    }

    #question {
      color: #102a43;
      font-size: 1.4rem;
    }

    #answers {
      display: grid;
      gap: 9px;
      margin: 20px 0;
    }

    .answer {
      padding: 12px;
      border: 1px solid #bcccdc;
      border-radius: 6px;
      background: white;
      color: #243b53;
      text-align: left;
      font: inherit;
      cursor: pointer;
    }

    .answer:hover:not(:disabled) {
      background: #edf6f7;
    }

    .answer:disabled { cursor: default; }
    .answer.correct { border-color: #238636; background: #e8f5e9; }
    .answer.incorrect { border-color: #c62828; background: #ffebee; }

    #feedback {
      min-height: 1.5em;
      font-weight: bold;
    }

    .quiz-button {
      padding: 11px 18px;
      border: 0;
      border-radius: 6px;
      background: #087e8b;
      color: white;
      font: inherit;
      cursor: pointer;
    }

    .quiz-button:hover { background: #066873; }
    [hidden] { display: none !important; }

    @media (max-width: 500px) {
      body { padding: 12px; }
      .quiz { margin: 12px auto; padding: 18px; }
    }
  </style>
</head>

<body>
  <main class="quiz">
    <div class="quiz-header">
      <span id="questionNumber">Question 1 of 5</span>
      <span>Score: <strong id="score">0</strong></span>
    </div>

    <div class="progress-track" aria-label="Quiz progress">
      <div id="progressBar"></div>
    </div>

    <section id="quizContent">
      <h1 id="question"></h1>
      <div id="answers"></div>
      <p id="feedback" aria-live="polite"></p>
      <button class="quiz-button" id="nextButton" type="button" hidden>
        Next Question
      </button>
    </section>

    <section id="result" aria-live="polite" hidden>
      <h1>Quiz Complete!</h1>
      <p id="finalScore"></p>
      <button class="quiz-button" id="retryButton" type="button">
        Try Again
      </button>
    </section>
  </main>

  <script>
    const questions = [
      {
        question: "What is the main purpose of a personal budget?",
        answers: [
          "To plan income and expenses",
          "To increase monthly expenses",
          "To avoid tracking spending",
          "To guarantee investment returns"
        ],
        correct: 0
      },
      {
        question: "How can diversification help an investment portfolio?",
        answers: [
          "It spreads investments across different assets",
          "It removes all investment risk",
          "It guarantees a profit",
          "It prevents the need for research"
        ],
        correct: 0
      },
      {
        question: "What is an emergency fund mainly used for?",
        answers: [
          "Unexpected expenses",
          "Regular entertainment spending",
          "Buying nonessential items",
          "Paying for planned vacations"
        ],
        correct: 0
      },
      {
        question: "What does compound interest mean?",
        answers: [
          "Earning interest on principal and accumulated interest",
          "Paying the same fee every month",
          "Borrowing without repayment",
          "A fixed price for a service"
        ],
        correct: 0
      },
      {
        question: "What should be considered before choosing an investment?",
        answers: [
          "Financial goals and risk tolerance",
          "Only the latest popular trend",
          "The highest advertised return",
          "Advice from an unknown source"
        ],
        correct: 0
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    const questionElement = document.getElementById("question");
    const answersElement = document.getElementById("answers");
    const feedbackElement = document.getElementById("feedback");
    const scoreElement = document.getElementById("score");
    const questionNumber = document.getElementById("questionNumber");
    const progressBar = document.getElementById("progressBar");
    const nextButton = document.getElementById("nextButton");
    const quizContent = document.getElementById("quizContent");
    const resultSection = document.getElementById("result");

    function showQuestion() {
      answered = false;

      const item = questions[currentQuestion];
      questionNumber.textContent =
        `Question ${currentQuestion + 1} of ${questions.length}`;
      questionElement.textContent = item.question;
      feedbackElement.textContent = "";
      answersElement.replaceChildren();
      nextButton.hidden = true;

      progressBar.style.width =
        `${(currentQuestion / questions.length) * 100}%`;

      item.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.className = "answer";
        button.type = "button";
        button.textContent = answer;
        button.addEventListener("click", () => selectAnswer(index, button));
        answersElement.appendChild(button);
      });
    }

    function selectAnswer(selectedIndex, selectedButton) {
      if (answered) return;
      answered = true;

      const correctIndex = questions[currentQuestion].correct;
      const answerButtons = answersElement.querySelectorAll(".answer");

      answerButtons.forEach((button, index) => {
        button.disabled = true;
        if (index === correctIndex) button.classList.add("correct");
      });

      if (selectedIndex === correctIndex) {
        score++;
        scoreElement.textContent = score;
        feedbackElement.textContent = "Correct! Well done.";
      } else {
        selectedButton.classList.add("incorrect");
        feedbackElement.textContent = "Not quite. The correct answer is highlighted.";
      }

      progressBar.style.width =
        `${((currentQuestion + 1) / questions.length) * 100}%`;

      nextButton.textContent =
        currentQuestion === questions.length - 1 ? "View Results" : "Next Question";
      nextButton.hidden = false;
    }

    nextButton.addEventListener("click", () => {
      currentQuestion++;

      if (currentQuestion < questions.length) {
        showQuestion();
      } else {
        quizContent.hidden = true;
        resultSection.hidden = false;
        document.getElementById("finalScore").textContent =
          `You scored ${score} out of ${questions.length}.`;
      }
    });

    document.getElementById("retryButton").addEventListener("click", () => {
      currentQuestion = 0;
      score = 0;
      scoreElement.textContent = "0";
      quizContent.hidden = false;
      resultSection.hidden = true;
      showQuestion();
    });

    showQuestion();
  </script>
</body>
</html>
